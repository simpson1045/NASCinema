# Builds NASCinema's apps on GitHub's machines and publishes a GitHub Release.
#
# Why: release builds used to run on a home PC (ALPINE) and could starve it
# (2026-09-26 — slow HDD + Gradle, two hard resets). Now nobody's machine
# builds anything; anyone who forks the repo gets the same builds.
#
# Two kinds of release (README "Versioning is earned"):
#   - Version release, tag vX.Y.Z: a finished, meaningful feature set. Bump
#     `version:` in frontend/pubspec.yaml (e.g. 0.10.0+38) and start a new
#     "## 0.10.0 - YYYY-MM-DD" section at the top of CHANGELOG.md.
#   - Build-only release, tag vX.Y.Z-bN: just ships fixes/polish to the apps.
#     Keep the version, raise only the build number (0.9.0+37 -> tag
#     v0.9.0-b37) and add the notes to the current "## 0.9.0" section.
#   The apps' updater compares build numbers only, so both reach every device;
#   the build number must always go up.
#
# Flow: commit the pubspec + CHANGELOG change, then
#   git tag v0.9.0-b37 && git push origin main v0.9.0-b37
# Which platforms (Matt, 2026-10-18 — ELKO is where NASCinema is used):
#   - beta tags (vX.Y.Z-bN): Windows only (nascinema-windows.zip, version.json)
#   - version tags (vX.Y.Z): Windows + Android + web, in parallel
#   - to loop Android/web into a beta: Actions → Release → Run workflow,
#     tag = the beta tag, platforms = all
# The server pulls it: deploy.sh --release v0.9.0-b37. version.json lists each
# platform's own build under "platforms", and deploy.sh merges it with the
# server's, so a Windows-only beta never offers the Android app an update.
#
# Android signing: if the ANDROID_DEBUG_KEYSTORE secret (base64 of a
# debug.keystore) is set, it's used so installed phones accept the update;
# otherwise the runner's own debug key signs (a one-time reinstall).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.9.0 or v0.9.0-b37) — must already exist"
        required: true
      platforms:
        description: "auto = betas Windows only, versions everything; or force windows / all"
        type: choice
        options: [auto, windows, all]
        default: auto

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.1"
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
      label: ${{ steps.v.outputs.label }}
      all: ${{ steps.v.outputs.all }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - id: v
        name: Read and check the version
        run: |
          line=$(grep -E '^version:' frontend/pubspec.yaml | head -1)
          full=${line#version: }
          version=${full%%+*}
          build=${full##*+}
          echo "pubspec: $full   tag: $TAG"
          # vX.Y.Z = version release; vX.Y.Z-bN = build-only release.
          tagver=${TAG#v}
          case "$tagver" in
            *-b*) tag_version=${tagver%%-b*}; tag_build=${tagver##*-b}
                  label="$version (build $build)" ;;
            *)    tag_version=$tagver; tag_build=""; label="$version" ;;
          esac
          if [ "$tag_version" != "$version" ]; then
            echo "::error::Tag $TAG doesn't match pubspec version $version"; exit 1
          fi
          if [ -n "$tag_build" ] && [ "$tag_build" != "$build" ]; then
            echo "::error::Tag $TAG is build $tag_build but pubspec says +$build"; exit 1
          fi
          if ! grep -q "^## $version " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $version' section"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"
          # Android + web too? Version releases yes, betas no — unless forced.
          case "${{ github.event.inputs.platforms || 'auto' }}" in
            all) all=true ;;
            windows) all=false ;;
            *) if [ -n "$tag_build" ]; then all=false; else all=true; fi ;;
          esac
          echo "Android + web: $all"
          echo "all=$all" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    # Visual Studio 2022 — the compiler family ALPINE built ELKO's app with.
    # (windows-latest moved to VS 2026, which rejects a plugin's old coroutine
    # header; CMakeLists also silences that, for when 2022 is retired.)
    runs-on: windows-2022
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      # The jni plugin's Windows native links the JDK's jvm.lib — needs an x64 JDK.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          architecture: x64
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip the Release folder
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath ../nascinema-windows.zip
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: nascinema-windows.zip
          if-no-files-found: error

  android:
    needs: version
    if: needs.version.outputs.all == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Use the established signing key (if provided)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Using the provided signing key."
          else
            echo "::warning::No ANDROID_DEBUG_KEYSTORE secret — signing with this runner's debug key."
          fi
      - run: flutter pub get
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk ../nascinema-android.apk
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: nascinema-android.apk
          if-no-files-found: error

  web:
    needs: version
    if: needs.version.outputs.all == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --pwa-strategy=none
      - run: tar -czf ../nascinema-web.tar.gz -C build/web .
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: nascinema-web.tar.gz
          if-no-files-found: error

  publish:
    needs: [version, windows, android, web]
    # Runs when Android/web were skipped (betas), never when one failed.
    if: >-
      always() && needs.windows.result == 'success' &&
      (needs.version.outputs.all != 'true' ||
       (needs.android.result == 'success' && needs.web.result == 'success'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: version.json + release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BUILD: ${{ needs.version.outputs.build }}
        run: |
          # Each platform this release built, with its own build — the server
          # merges these so a Windows-only beta leaves Android's build alone.
          python3 - <<'PY'
          import json, os
          v, b = os.environ["VERSION"], int(os.environ["BUILD"])
          files = {"windows": "dist/nascinema-windows.zip", "android": "dist/nascinema-android.apk"}
          plats = {p: {"version": v, "build": b, "size": os.path.getsize(f)}
                   for p, f in files.items() if os.path.exists(f)}
          out = {"released_at": __import__("datetime").date.today().isoformat(),
                 "version": v, "build_number": b, "platforms": plats}
          out.update({f"{p}_size": e["size"] for p, e in plats.items()})
          json.dump(out, open("dist/version.json", "w"), indent=2)
          PY
          cat dist/version.json
          # This version's CHANGELOG section becomes the release notes.
          awk -v v="## $VERSION " 'index($0,v)==1{on=1} on&&/^## /&&index($0,v)!=1{exit} on' CHANGELOG.md > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: NASCinema ${{ needs.version.outputs.label }}
          body_path: notes.md
          files: |
            dist/nascinema-windows.zip
            dist/nascinema-android.apk
            dist/nascinema-web.tar.gz
            dist/version.json
