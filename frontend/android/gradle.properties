# Memory limits for Android builds on ALPINE, a shared machine.
#
# Flutter's template ships -Xmx8G + 4G metaspace, keeps the Gradle daemon (and a
# separate Kotlin compile daemon) resident for hours after a build, and lets
# workers run in parallel. On ALPINE that stacked up across release builds and
# starved the machine until AAPT2's own daemon couldn't start ("AAPT2 Daemon
# startup failed") and Windows froze outright (2026-09-26, twice; hard reset).
#
# Now: a capped heap, no resident daemons (each build's JVM exits when done),
# Kotlin compiled inside that same JVM, and at most two workers.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=2
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx1g

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
